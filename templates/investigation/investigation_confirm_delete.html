{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Delete Investigation | BlueShield</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/blueshield.css' %}"
    >

</head>


<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-5 text-center">

                    <i
                        class="bi bi-exclamation-triangle text-danger"
                        style="font-size: 3rem;"
                    ></i>


                    <h3 class="fw-bold mt-3">
                        Delete Investigation Record?
                    </h3>


                    <p class="text-muted">

                        You are about to delete the investigation activity:

                    </p>


                    <div class="alert alert-light border">

                        <strong>
                            {{ investigation.activity }}
                        </strong>

                        <br>

                        <small class="text-muted">
                            {{ investigation.case.case_number }}
                        </small>

                    </div>


                    <p class="text-danger small">
                        This action cannot be undone.
                    </p>


                    <form method="POST">

                        {% csrf_token %}


                        <a
                            href="{% url 'investigation:detail' investigation.pk %}"
                            class="btn btn-outline-secondary me-2"
                        >

                            Cancel

                        </a>


                        <button
                            type="submit"
                            class="btn btn-danger"
                        >

                            <i class="bi bi-trash me-1"></i>

                            Delete Record

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
