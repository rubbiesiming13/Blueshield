<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlueShield | Request Warrant</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Request Warrant</h3>
        </div>

        <div class="card-body">

            <p>
                Welcome, <strong>{{ user }}</strong>.
            </p>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="reason" class="form-label">
                        Reason for Warrant Request
                    </label>

                    <textarea
                        id="reason"
                        name="reason"
                        class="form-control"
                        rows="5"
                        required
                    ></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    Submit Request
                </button>

                <a
                    href="{% url 'accounts:dashboard' %}"
                    class="btn btn-secondary"
                >
                    Back to Dashboard
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
